<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href=".harness-assets/all.min.css">
<link rel="stylesheet" href="assets/css/dior-custom.css">
<style>body{margin:0;background:#F1F5F9;font-family:Montserrat,Arial,sans-serif}</style>
</head><body>
<div class="dior-auth-wrap">
  <div class="dior-reg-card-container">
    <div class="dior-login-header">
      <h3 class="dior-reg-title">Create Your Account</h3>
      <p class="dior-reg-subtitle">Register to book consultations and access your records.</p>
    </div>
    <form class="dior-auth-form">
      <div class="dior-form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Jane Doe">
      </div>
      <div class="dior-form-group">
        <label>Email Address</label>
        <input type="email" placeholder="you@example.com">
      </div>
      <div class="dior-auth-msg success" style="display:block">Your registration was submitted.</div>
      <div class="dior-auth-msg error" style="display:block; margin-top:8px">That email is already registered.</div>
      <div class="dior-form-submit">
        <button type="submit" class="dior-btn-reg-submit"><span>Create Account</span></button>
      </div>
    </form>
  </div>
</div>
</body></html>
