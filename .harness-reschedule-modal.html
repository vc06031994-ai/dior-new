<script>
// Intercept the reschedule AJAX so the harness never leaves the page.
window.fetch=function(url,opts){
  var body=(opts&&opts.body)||'';
  window.__posted.push(body);
  if(body.indexOf('dior_patient_reschedule_appointment')!==-1){
    return Promise.resolve({json:function(){return Promise.resolve({success:true,data:{message:'Rescheduled to the new slot.'}});}});
  }
  return Promise.resolve({json:function(){return Promise.resolve({success:false,data:{message:'stub'}});}});
};
</script>
