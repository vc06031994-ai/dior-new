<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href=".harness-assets/all.min.css">
<link rel="stylesheet" href="assets/css/dior-custom.css">
<style>body{margin:0;background:#F1F5F9;font-family:Montserrat,Arial,sans-serif}</style>
</head><body>
<div class="dior-auth-wrap">
  <div class="dior-login-split-container">
    <div class="dior-login-left-panel">
      <img src=".harness-assets/logo-crest.png" alt="Doctor and Patient" class="dior-login-image">
    </div>
    <div class="dior-login-right-panel">
      <div class="dior-login-header">
        <h3 class="dior-login-title">Log In</h3>
        <p class="dior-login-subtitle">Access your appointments, prescriptions, intake forms, and records.</p>
      </div>
      <form id="dior-login-form" class="dior-auth-form" novalidate>
        <div class="dior-form-group">
          <label for="dior-login-username">Email or Username</label>
          <input type="text" id="dior-login-username" name="username" placeholder="Email or Username" required autocomplete="username" class="dior-login-input">
        </div>
        <div class="dior-form-group">
          <label for="dior-login-password">Password</label>
          <div class="dior-input-pwd-wrap" style="position:relative;">
            <input type="password" id="dior-login-password" name="password" placeholder="********" required autocomplete="current-password" class="dior-login-input">
            <button type="button" class="dior-pwd-toggle" id="dior-toggle-login-pwd" aria-label="Toggle password visibility">
              <svg class="dior-eye-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="dior-form-check-row" style="justify-content: space-between;">
          <label class="dior-custom-checkbox">
            <input type="checkbox" name="rememberme" value="forever" checked>
            <span class="dior-checkmark"></span>
            <span class="dior-check-text">Remember me on this device</span>
          </label>
          <a href="#" class="dior-forgot-link">Forgot password?</a>
        </div>
        <div class="dior-form-submit">
          <button type="submit" class="dior-btn-login-submit" id="dior-login-submit-btn"><span>Sign In To Dashboard &rarr;</span></button>
        </div>
      </form>
      <div class="dior-auth-bottom-link-redesign">
        <p>First time visiting? <a href="#">Create Patient Account</a></p>
      </div>

      
    </div>
  </div>
</div>
</body></html>
